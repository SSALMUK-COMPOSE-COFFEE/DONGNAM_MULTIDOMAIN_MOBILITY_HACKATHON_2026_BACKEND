name: freshswitch-saas

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env.saas
    environment:
      POSTGRES_HOST: db
      SAAS_MODE: "true"
      API_PREFIX: /test/api
      SESSION_COOKIE_PATH: /test
      SESSION_COOKIE_SECURE: "true"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
        restart: true
    ports:
      - "127.0.0.1:18106:8000"

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file: .env.saas
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - effective_cache_size=192MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=32MB
      - -c
      - max_connections=40
    shm_size: 128m
    mem_limit: 512m
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 10s

volumes:
  pgdata:
